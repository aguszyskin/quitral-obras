on: push
permissions: {contents: write}
jobs: {trim: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {run: "if [ ! -d v2 ]; then pip install pillow && python3 -c \"from PIL import Image; import glob,os; os.makedirs('v2',exist_ok=True); [Image.open(f).convert('RGB').crop((3,3,Image.open(f).width-3,Image.open(f).height-3)).save('v2/'+f,quality=92) for f in glob.glob('*.jpg')]\" && git config user.name bot && git config user.email bot@users.noreply.github.com && git add v2 && git commit -m v2 && git push; fi"}]}}
